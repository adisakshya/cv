name: Slack Notification
run-name: Pushing notification on Slack channel
on: [push]

jobs:
  Notify-Slack-Channel:
    runs-on: ubuntu-latest
    steps:
      - name: Send custom JSON data to Slack workflow
        id: slack
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*${{ github.workflow }}* - `${{ github.job }}` has *${{ job.status }}* on branch `${{ github.ref_name }}`\n\n*Repo*: <${{ github.event.repository.html_url }}|${{ github.repository }}>\n*Commit*: <${{ github.event.head_commit.url }}|${{ github.sha }}>\n*Message*: ${{ github.event.head_commit.message }}\n*Author*: ${{ github.event.head_commit.author.name }} <${{ github.event.head_commit.author.email }}>\n*Event*: `${{ github.event_name }}`\n*Ref*: `${{ github.ref }}\n*Workflow*: `${{ github.workflow }}`"
                  }
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "Took *${{ steps.slack.outputs.duration }} sec*"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
